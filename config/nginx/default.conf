# Default server: landing page portal (localhost, direct IP, unknown hosts)
server {
    listen 80 default_server;
    server_name _ localhost 127.0.0.1 beach.yucatanmx.com;
    root /usr/share/nginx/html;
    index landing/index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location = /config.json {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /landing/index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    include /etc/nginx/conf.d/rtm-snippet;
}

