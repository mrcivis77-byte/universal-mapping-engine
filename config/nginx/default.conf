# Bus app
server {
    listen 80;
    server_name bus.yucatanmx.com;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location = /config.json {
        alias /usr/share/nginx/html/config.bus.json;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Bus branding: this app is its own brand, so it gets its own
    # manifest, favicon and home-screen icon.
    location = /manifest.json {
        alias /usr/share/nginx/html/manifest-bus.json;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    location = /images/favicon-32x32.png {
        alias /usr/share/nginx/html/images/bus-favicon-32.png;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /images/favicon-16x16.png {
        alias /usr/share/nginx/html/images/bus-favicon-16.png;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /images/apple-touch-icon.png {
        alias /usr/share/nginx/html/images/bus-apple-touch-icon.png;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /images/app-icon-192.png {
        alias /usr/share/nginx/html/images/bus-icon-192.png;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /images/app-icon-512.png {
        alias /usr/share/nginx/html/images/bus-icon-512.png;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        # Never cache the SPA shell: the versioned ?v= refs inside it drive
        # cache-busting of the immutable JS/CSS/SVG assets. Heuristic caching
        # of index.html made clients keep requesting old immutable assets.
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    include /etc/nginx/conf.d/rtm-snippet;
}

