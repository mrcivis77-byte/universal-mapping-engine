# Default server: SPA with the base config (localhost, direct IP, unknown hosts)
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location = /config.json {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri.html $uri/ /index.html;
        # Never cache the SPA shell: the versioned ?v= refs inside it drive
        # cache-busting of the immutable JS/CSS/SVG assets. Heuristic caching
        # of index.html made clients keep requesting old immutable assets.
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    include /etc/nginx/conf.d/rtm-snippet;
}

