# Fishing app
server {
    listen 80;
    server_name fishing.yucatanmx.com;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location = /config.json {
        alias /usr/share/nginx/html/config.fishing.json;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Fishing branding: this app is its own brand, so it gets its own
    # manifest, favicon and home-screen icon.
    location = /manifest.json {
        alias /usr/share/nginx/html/manifest-fishing.json;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    location = /images/favicon-32x32.png {
        alias /usr/share/nginx/html/images/fishing-favicon-32.png;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /images/favicon-16x16.png {
        alias /usr/share/nginx/html/images/fishing-favicon-16.png;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /images/apple-touch-icon.png {
        alias /usr/share/nginx/html/images/fishing-apple-touch-icon.png;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /images/app-icon-192.png {
        alias /usr/share/nginx/html/images/fishing-icon-192.png;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /images/app-icon-512.png {
        alias /usr/share/nginx/html/images/fishing-icon-512.png;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Dedicated fishing app UI (top header with title + gear, 5-tab bottom
    # nav) - deliberately different look from the shared transit SPA that
    # the bus/moto/drive/parque domains use.
    # Serve the dedicated fishing app (docroot/fish) at the domain root.
    # Root-relative try_files (NOT alias - broken with try_files): every URI
    # is mapped into /fish/ so relative assets like /fish.css resolve.
    # ^~ is REQUIRED: without it the rtm-snippet regex location for
    # css/js/img steals asset requests and 404s them from the docroot.
    location ^~ / {
        root /usr/share/nginx/html;
        try_files /fish$uri /fish$uri.html /fish$uri/ /fish/index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Internal redirect target and legacy /fish/... deep links.
    location ^~ /fish/ {
        root /usr/share/nginx/html;
        try_files $uri $uri.html $uri/ =404;

        # The SPA shell lands here via try_files internal redirect from
        # "location ^~ /" above, so HTML must get no-store HERE as well.
        location ~* /fish/index\.html$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # Service worker must always revalidate so updates propagate.
        location = /fish/fish-sw.js {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }

    include /etc/nginx/conf.d/rtm-snippet;
}

